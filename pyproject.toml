[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kkpay-client"
version = "0.3.0"
description = "Complete merchant-side USDT/TRX collection SDK for KKPay-compatible gateways"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "halokik" }]
keywords = ["kkpay", "payment", "usdt", "trx", "trc20"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "qrcode[pil]>=7.4,<9",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110,<1"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "fastapi>=0.110,<1"]

[project.urls]
Homepage = "https://github.com/halokik/kkpay-client"
Repository = "https://github.com/halokik/kkpay-client"
Issues = "https://github.com/halokik/kkpay-client/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kkpay"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
